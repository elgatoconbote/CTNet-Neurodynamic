name: Temporary NLLB model fetch

on:
  push:
    branches:
      - tmp/model-fetch-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Download and split NLLB Q4 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nllb/onnx parts
          base="https://huggingface.co/Xenova/nllb-200-distilled-600M/resolve/main"
          for f in config.json generation_config.json sentencepiece.bpe.model special_tokens_map.json tokenizer.json tokenizer_config.json quantize_config.json; do
            curl -fL --retry 5 --retry-delay 3 "$base/$f?download=true" -o "nllb/$f"
          done
          curl -fL --retry 5 --retry-delay 3 "$base/onnx/encoder_model_q4.onnx?download=true" -o nllb/onnx/encoder_model_q4.onnx
          curl -fL --retry 5 --retry-delay 3 "$base/onnx/decoder_model_merged_q4.onnx?download=true" -o nllb/onnx/decoder_model_merged_q4.onnx
          tar -cf nllb-q4.tar nllb
          split -b 300M -d -a 2 nllb-q4.tar parts/nllb-q4.part-
          ls -lh parts
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-part-00
          path: parts/nllb-q4.part-00
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-part-01
          path: parts/nllb-q4.part-01
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-part-02
          path: parts/nllb-q4.part-02
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-part-03
          path: parts/nllb-q4.part-03
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-part-04
          path: parts/nllb-q4.part-04
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-part-05
          path: parts/nllb-q4.part-05
          if-no-files-found: ignore
          retention-days: 1
