name: Temporary Transformers.js runtime package

on:
  push:
    branches:
      - tmp/model-fetch-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Install Transformers.js runtime
        run: |
          npm init -y
          npm install @huggingface/transformers@3.7.2
          tar -czf transformers-js-runtime.tar.gz node_modules package.json package-lock.json
          ls -lh transformers-js-runtime.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: transformers-js-runtime
          path: transformers-js-runtime.tar.gz
          retention-days: 1
