name: Temporary translation model fetch

on:
  push:
    branches:
      - tmp/model-fetch-20260711
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Argos Spanish-English model
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            "https://argos-net.com/v1/translate-es_en-1_9.argosmodel" \
            -o translate-es_en-1_9.argosmodel
          ls -lh translate-es_en-1_9.argosmodel
      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: argos-translate-es-en
          path: translate-es_en-1_9.argosmodel
          retention-days: 1
