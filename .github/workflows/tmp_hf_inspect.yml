name: Temporary NLLB translation test

on:
  push:
    branches:
      - tmp/model-fetch-20260711
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/model-fetch-20260711
      - name: Download NLLB Q4 files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p nllb/onnx
          base="https://huggingface.co/Xenova/nllb-200-distilled-600M/resolve/main"
          for f in config.json generation_config.json sentencepiece.bpe.model special_tokens_map.json tokenizer.json tokenizer_config.json quantize_config.json; do
            curl -fL --retry 5 --retry-delay 3 "$base/$f?download=true" -o "nllb/$f"
          done
          curl -fL --retry 5 --retry-delay 3 "$base/onnx/encoder_model_q4.onnx?download=true" -o nllb/onnx/encoder_model_q4.onnx
          curl -fL --retry 5 --retry-delay 3 "$base/onnx/decoder_model_merged_q4.onnx?download=true" -o nllb/onnx/decoder_model_merged_q4.onnx
      - name: Install Transformers.js
        run: npm install @huggingface/transformers@3.7.2
      - name: Translate samples sentence by sentence
        shell: bash
        run: |
          cat > translate.mjs <<'JS'
          import fs from 'node:fs';
          import { pipeline, env } from '@huggingface/transformers';
          env.allowRemoteModels = false;
          env.localModelPath = '.';
          const inputs=JSON.parse(fs.readFileSync('tmp_translation_inputs.json','utf8'));
          const translator=await pipeline('translation','nllb',{dtype:'q4'});
          function splitSentences(s){
            const a=s.match(/[^.!?;]+(?:[.!?;]+|$)/gu) || [s];
            return a.map(x=>x.trim()).filter(Boolean);
          }
          function repair(src,t){
            let x=t.replaceAll('EMQRCTNet','EMQR–CTNet').replaceAll('EMQR-CTNet','EMQR–CTNet');
            if(/\bcarta(s)?\b/iu.test(src)) x=x.replace(/\bletter(s)?\b/giu,(_,p)=>p?'charts':'chart');
            if(/\bfuente(s)?\b/iu.test(src)) x=x.replace(/\bfont(s)?\b/giu,(_,p)=>p?'sources':'source');
            if(/\bcomparecencia\b/iu.test(src)) x=x.replace(/\bappearance\b/giu,'appearing');
            if(/\bendofuntor/iu.test(src)) x=x.replace(/\b(power|function|functor) generator\b/giu,'generating endofunctor').replace(/\bendofunctor generator\b/giu,'generating endofunctor');
            x=x.replace(/\birrevatability\b/giu,'irrefutability').replace(/\bcollebra\b/giu,'coalgebra');
            return x;
          }
          const output=[];
          for(const item of inputs){
            const sentences=splitSentences(item.source);
            const pieces=[];
            for(const s of sentences){
              const r=await translator(s,{src_lang:'spa_Latn',tgt_lang:'eng_Latn',max_new_tokens:512,num_beams:4});
              pieces.push(repair(s,r[0].translation_text));
            }
            const text=pieces.join(' ');
            output.push({...item,text});
            console.log(item.id,text);
          }
          fs.writeFileSync('translation_output.json',JSON.stringify(output,null,2));
          JS
          node translate.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: nllb-sample-output-v2
          path: translation_output.json
          retention-days: 1
